name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Go version supported, per go.mod
          - name: go 1.18
            go-version: '1.18'
          # Development version, per .tool-versions
          - name: .tool-versions
            go-version-file: .tool-versions
            lint: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      - name: Check formatting
        if: matrix.lint
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        if: matrix.lint
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...
